<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>에이블리 로그인 화면</title>
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="./login.css">
    <link rel="stylesheet" href="./login_theme.css">
    <link id="themeStylesheet" rel="stylesheet">
    <script src="./login_theme.js" defer></script>
</head>
<body>
    <div id="wrap">
        <header>
            <h1>로그인</h1>
            <button type="button" class="prev_btn">
                <span class="sr-only">이전 버튼</span>
            </button>
        </header>

        <div class="theme_switcher">
            <label for="themeSelect">디자인 테마</label>
            <select id="themeSelect" name="theme">
                <option value="">기본 디자인</option>
                <option value="neo">Neo Brutalism</option>
                <option value="glass">Glassmorphism</option>
                <option value="pixel">Pixel Art</option>
            </select>
        </div>

        <main>
            <div class="ably_logo">
                <img src="img/ably_logo.svg" alt="에이블리">
            </div>

            <form action="#">
                <fieldset>
                    <legend class="sr-only">이메일 로그인</legend>

                    <div class="input_area">
                        <label for="email">이메일 로그인</label>

                        <div class="input_box">
                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="아이디(이메일)를 입력해 주세요."
                            >
                        </div>

                        <div class="input_box pw_input">
                            <label for="password" class="sr-only">비밀번호</label>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="비밀번호를 입력해 주세요."
                            >
                            <button type="button" class="pw_btn">
                                <span class="sr-only">비밀번호 보기</span>
                            </button>
                        </div>
                    </div>

                    <div class="login_option">
                        <label>
                            <input type="checkbox" class="check sr-only" checked>
                            <span>자동 로그인</span>
                        </label>

                        <label>
                            <input type="checkbox" class="check sr-only">
                            <span>아이디 저장</span>
                        </label>
                    </div>

                    <button type="submit" class="login_btn">로그인</button>
                </fieldset>
            </form>

            <div class="login_link">
                <a href="#">아이디 찾기</a>
                <a href="#">비밀번호 재설정</a>
                <a href="#">회원가입</a>
            </div>

            <div class="sns_login">
                <p>SNS로 간편하게 로그인</p>

                <div class="sns_list">
                    <a href="#">
                        <span class="sr-only">카카오 로그인</span>
                    </a>
                    <a href="#">
                        <span class="sr-only">네이버 로그인</span>
                    </a>
                    <a href="#">
                        <span class="sr-only">애플 로그인</span>
                    </a>
                    <a href="#">
                        <span class="sr-only">삼성카드 로그인</span>
                    </a>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
