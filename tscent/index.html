<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>티센트 리뉴얼 포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
        <header>
            <div>
                <img src="img/logo.svg" alt="티센트 로고 이미지">
                <span><a href="#">차·도구</a></span>
                <span><a href="#">문화·이해</a></span>
                <span><a href="#">About</a></span>
                <span><a href="#">Notice</a></span>
            </div>
            <div>
                <span><a href="#">검색</a></span>
                <span><a href="#">로그인</a></span>
                <span><a href="#">회원가입</a></span>
                <span><a href="#">장바구니 0</a></span>
                <img src="img/icon-menu.svg" alt="메뉴 아이콘">
            </div>
        </header>
        <main>
            <div class="hero-sec">
                <div class="swiper visual">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                                <img src="img/visual01(fix).png" alt="티센트 소개 배너" class="pc">
                                <img src="img/m_visual01.png" alt="모바일 티센트 소개 배너" class="mo">
                            <div>
                                <div>
                                    <span>TSCENT</span>
                                    <span>차 한 잔에 깃든<br>일상의 여유</span>
                                    <span>차와 동양의 문화, 미학을 하나의 경험으로.</span>
                                </div>
                                <div>
                                    <button>브랜드 이야기 보기</button>
                                </div>
                            </div>
                        </div>
                        <div class="swiper-slide">
                                <img src="img/visual02(fix).png" alt="티센트 강의 배너" class="pc">
                                <img src="img/m_visual02.png" alt="모바일 티센트 강의 배너" class="mo">
                            <div>
                                <div>
                                    <span>CULTURE & UNDERSTANDING</span>
                                    <span>차를 마시는 시간을 넘어<br>차를 이해하는 시간으로</span>
                                    <span>전시와 강의, 체험을 통해 차의 문화와 미학을 만납니다.</span>
                                </div>
                                <div>
                                    <button>문화·이해 보기</button>
                                </div>
                            </div>
                        </div>
                        <div class="swiper-slide">
                                <img src="img/visual03(fix).png" alt="티센트 찻잎 배너" class="pc">
                                <img src="img/m_visual03.png" alt="모바일 티센트 찻잎 배너" class="mo">
                            <div>
                                <div>
                                    <span>LEAF TEA</span>
                                    <span>산의 향기를 담은<br>대만 아리산 탄배오룡</span>
                                    <span>고산지대의 향과 전통 배화 방식이 만든 깊은 풍미.</span>
                                </div>
                                <div>
                                    <button>대표상품 보기</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Figma 형태의 선형 pagination -->
                    <div class="swiper-pagination"></div>

                    <!-- Figma 형태의 좌우 이동 버튼 -->
                    <button type="button" class="swiper-button-prev">
                        <span class="sr-only">이전 배너</span>
                    </button>
                    <button type="button" class="swiper-button-next">
                        <span class="sr-only">다음 배너</span>
                    </button>
                </div>
            </div>
        </main>
        <footer>&copy;</footer>
    </div>

    <script>
        const swiper = new Swiper('.hero-sec > .swiper', {
            direction: 'horizontal',
            loop: true,

            pagination: {
                el: '.visual .swiper-pagination',
                clickable: true,
                renderBullet: function (index, className) {
                    return '<span class="' + className + '" aria-label="' + (index + 1) + '번째 배너"></span>';
                },
            },

            /* autoplay: {
                delay: 5000,
            }, */

            navigation: {
                nextEl: '.visual .swiper-button-next',
                prevEl: '.visual .swiper-button-prev',
            },
        });
    </script>
</body>
</html>
