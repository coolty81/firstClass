<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>티센트 리뉴얼 포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
        <header>
            <div>
                <img src="img/logo.svg" alt="티센트 로고 이미지">
                <p>차·도구</p>
                <p>문화·이해</p>
                <p>About</p>
                <p>Notice</p>
            </div>
            <div>
                <p>검색</p>
                <p>로그인</p>
                <p>회원가입</p>
                <p>장바구니 0</p>
            </div>
        </header>
        <main>
            <div class="hero-sec">
                <div class="swiper visual">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <img src="img/visual01(fix).png" alt="티센트 소개 배너" class="pc">
                            <img src="img/m_visual01.png" alt="모바일 티센트 소개 배너" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/visual02(fix).png" alt="티센트 강의 배너" class="pc">
                            <img src="img/m_visual02.png" alt="모바일 티센트 강의 배너" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/visual03(fix).png" alt="티센트 찻잎 배너" class="pc">
                            <img src="img/m_visual03.png" alt="모바일 티센트 찻잎 배너" class="mo">
                        </div>
                    </div>

                    <!-- Figma 형태의 선형 pagination -->
                    <div class="swiper-pagination"></div>

                    <!-- Figma 형태의 좌우 이동 버튼 -->
                    <button type="button" class="swiper-button-prev">
                        <span class="sr-only">이전 배너</span>
                    </button>
                    <button type="button" class="swiper-button-next">
                        <span class="sr-only">다음 배너</span>
                    </button>
                </div>
            </div>
        </main>
        <footer>&copy;</footer>
    </div>

    <script>
        const swiper = new Swiper('.hero-sec > .swiper', {
            direction: 'horizontal',
            loop: true,

            pagination: {
                el: '.visual .swiper-pagination',
                clickable: true,
                renderBullet: function (index, className) {
                    return '<span class="' + className + '" aria-label="' + (index + 1) + '번째 배너"></span>';
                },
            },

            autoplay: {
                delay: 5000,
            },

            navigation: {
                nextEl: '.visual .swiper-button-next',
                prevEl: '.visual .swiper-button-prev',
            },
        });
    </script>
</body>
</html>
